<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <meta name="googlebot" content="noindex, nofollow">
    <title>Sanctum Secretum - Hidden Chatroom</title>
    <style>
        :root {
            --black: #000000;
            --blue: #0000AA;
            --green: #00AA00;
            --cyan: #00AAAA;
            --red: #AA0000;
            --purple: #AA00AA;
            --brown: #AA5500;
            --light-gray: #AAAAAA;
            --dark-gray: #555555;
            --light-blue: #5555FF;
            --light-green: #55FF55;
            --light-cyan: #55FFFF;
            --light-red: #FF5555;
            --light-purple: #FF55FF;
            --yellow: #FFFF55;
            --white: #FFFFFF;
            --ink: #8B2500;
            --parchment: #E8DCC4;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: var(--black);
            color: var(--light-gray);
            height: 100%;
            min-height: 100vh;
            min-height: -webkit-fill-available; /* iOS Safari fix */
        }

        .container {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            min-height: -webkit-fill-available; /* iOS Safari fix */
            max-width: 900px;
            margin: 0 auto;
            border-left: 2px solid var(--blue);
            border-right: 2px solid var(--blue);
            position: relative;
        }

        /* Header */
        .header {
            background: var(--blue);
            color: var(--yellow);
            padding: 15px;
            text-align: center;
            border-bottom: 2px solid var(--light-blue);
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .subtitle {
            font-size: 12px;
            color: var(--light-cyan);
            margin-top: 5px;
            font-style: italic;
        }

        /* Username Section */
        .username-section {
            background: var(--dark-gray);
            padding: 10px 15px;
            border-bottom: 2px solid var(--light-blue);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .username-section label {
            color: var(--light-cyan);
            font-size: 14px;
        }

        .username-section input {
            flex: 1;
            background: var(--black);
            border: 2px solid var(--cyan);
            color: var(--light-green);
            padding: 5px 10px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
        }

        .username-section input:focus {
            outline: none;
            border-color: var(--light-cyan);
        }

        /* Messages Area */
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            background: var(--black);
        }

        .message {
            margin-bottom: 15px;
            padding: 8px 12px;
            border-left: 3px solid var(--blue);
            background: rgba(0, 0, 170, 0.1);
        }

        .message.own {
            border-left-color: var(--green);
            background: rgba(0, 170, 0, 0.1);
        }

        .message-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }

        .message-user {
            color: var(--light-cyan);
            font-weight: bold;
            font-size: 14px;
        }

        .message.own .message-user {
            color: var(--light-green);
        }

        .message-time {
            color: var(--dark-gray);
            font-size: 12px;
        }

        .message-text {
            color: var(--light-gray);
            font-size: 14px;
            line-height: 1.4;
            word-wrap: break-word;
        }

        .message-image {
            max-width: 100%;
            max-height: 400px;
            width: auto;
            height: auto;
            margin-top: 8px;
            border: 2px solid var(--blue);
            border-radius: 4px;
            display: block;
            cursor: pointer;
            object-fit: contain;
        }

        .message-image:hover {
            border-color: var(--light-blue);
            opacity: 0.9;
        }

        /* Ensure images load and display */
        .message-image[src] {
            visibility: visible;
        }

        .uploading-indicator {
            color: var(--yellow);
            font-size: 12px;
            font-style: italic;
            margin-top: 5px;
        }

        .system-message {
            text-align: center;
            color: var(--yellow);
            font-size: 12px;
            font-style: italic;
            margin: 10px 0;
            padding: 5px;
            border-top: 1px dashed var(--dark-gray);
            border-bottom: 1px dashed var(--dark-gray);
        }

        /* Input Area */
        .input-section {
            background: var(--dark-gray);
            padding: 15px;
            border-top: 2px solid var(--light-blue);
            display: flex;
            gap: 10px;
            position: sticky;
            bottom: 0;
            z-index: 10;
        }

        .input-section textarea {
            flex: 1;
            background: var(--black);
            border: 2px solid var(--cyan);
            color: var(--light-gray);
            padding: 10px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            resize: none;
            height: 60px;
        }

        .input-section textarea:focus {
            outline: none;
            border-color: var(--light-cyan);
        }

        .input-section button {
            background: var(--blue);
            color: var(--yellow);
            border: 2px solid var(--light-blue);
            padding: 10px 20px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .input-section button:hover {
            background: var(--light-blue);
            color: var(--white);
        }

        .input-section button:active {
            transform: scale(0.95);
        }

        /* Online Count */
        .online-indicator {
            background: var(--dark-gray);
            padding: 8px 15px;
            border-bottom: 1px solid var(--dark-gray);
            text-align: right;
            font-size: 12px;
            color: var(--light-green);
        }

        /* Scrollbar */
        .messages-container::-webkit-scrollbar {
            width: 12px;
        }

        .messages-container::-webkit-scrollbar-track {
            background: var(--black);
        }

        .messages-container::-webkit-scrollbar-thumb {
            background: var(--blue);
            border: 2px solid var(--black);
        }

        .messages-container::-webkit-scrollbar-thumb:hover {
            background: var(--light-blue);
        }

        /* Back Link */
        .back-link {
            position: absolute;
            top: 15px;
            left: 15px;
            color: var(--light-cyan);
            text-decoration: none;
            font-size: 14px;
            z-index: 100;
        }

        .back-link:hover {
            color: var(--yellow);
        }

        /* Connection Status */
        .connection-status {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 12px;
            padding: 5px 10px;
            border-radius: 3px;
            z-index: 100;
        }

        .connection-status.connected {
            background: var(--green);
            color: var(--white);
        }

        .connection-status.disconnected {
            background: var(--red);
            color: var(--white);
        }

        /* Setup Warning */
        .setup-warning {
            background: var(--red);
            color: var(--yellow);
            padding: 20px;
            margin: 20px;
            border: 3px solid var(--light-red);
            text-align: center;
            font-weight: bold;
        }

        .setup-warning a {
            color: var(--light-cyan);
        }

        /* ================================ */
        /* MOBILE RESPONSIVE STYLES */
        /* ================================ */

        @media (max-width: 768px) {
            /* Fix mobile scrolling and viewport */
            body {
                overflow: auto;
            }

            .container {
                height: auto;
                min-height: calc(100vh - env(safe-area-inset-bottom));
                border-left: none;
                border-right: none;
            }

            /* Input section mobile optimization */
            .input-section {
                padding: 10px;
                padding-bottom: max(10px, env(safe-area-inset-bottom));
                gap: 8px;
            }

            .input-section textarea {
                font-size: 16px; /* Prevents iOS zoom */
                padding: 12px;
            }

            .input-section button {
                padding: 12px 20px;
                min-height: 48px;
                min-width: 70px;
                font-size: 13px;
                touch-action: manipulation;
            }

            /* Messages container mobile spacing */
            .messages-container {
                padding: 10px;
                padding-bottom: 20px;
            }

            .message {
                padding: 6px 10px;
                margin-bottom: 10px;
            }

            /* Header mobile adjustments */
            .header {
                font-size: 18px;
                padding: 12px;
            }

            .subtitle {
                font-size: 13px;
            }

            /* Username section mobile */
            .username-section {
                padding: 8px 10px;
            }

            .username-section label {
                font-size: 16px; /* Prevents iOS zoom */
            }

            .username-section input {
                padding: 12px;
                min-height: 44px;
                font-size: 16px; /* Prevents iOS zoom */
            }

            /* Typography improvements */
            .message-text {
                font-size: 16px;
                line-height: 1.5;
            }

            .message-user {
                font-size: 15px;
            }

            .message-time {
                font-size: 11px;
            }

            /* Mobile image optimization */
            .message-image {
                max-height: 300px !important;
                max-width: 100% !important;
                min-height: 50px !important;
                min-width: 50px !important;
                width: auto !important;
                height: auto !important;
                display: block !important;
                visibility: visible !important;
                opacity: 1 !important;
                background: var(--dark-gray) !important;
            }

            .online-indicator {
                font-size: 13px;
                padding: 6px 10px;
            }

            /* Back link mobile touch target */
            .back-link {
                font-size: 16px;
                padding: 10px 12px;
                min-height: 44px;
                min-width: 44px;
                display: inline-flex;
                align-items: center;
                top: 8px;
                left: 8px;
            }

            /* Connection status mobile */
            .connection-status {
                font-size: 11px;
                padding: 4px 8px;
                top: 8px;
                right: 8px;
            }
        }

        /* Very small screens - stack input */
        @media (max-width: 400px) {
            .username-section {
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
            }

            .username-section label {
                font-size: 14px;
            }

            .input-section {
                flex-direction: column;
            }

            .input-section button {
                width: 100%;
            }

            .header {
                font-size: 16px;
                padding: 10px;
                letter-spacing: 1px;
            }

            .subtitle {
                font-size: 11px;
            }
        }

        /* Improve focus indicators for accessibility */
        .input-section textarea:focus,
        .username-section input:focus {
            outline: 3px solid var(--light-cyan);
            outline-offset: 2px;
            border-color: var(--light-cyan);
        }

        .input-section button:focus {
            outline: 3px solid var(--yellow);
            outline-offset: 2px;
        }

        .back-link:focus {
            outline: 2px solid var(--light-cyan);
            outline-offset: 4px;
        }

        /* Message Actions (Reply / Delete) */
        .message-actions {
            display: flex;
            gap: 12px;
            margin-top: 6px;
        }

        .message-actions button {
            background: none;
            border: none;
            color: var(--dark-gray);
            font-family: 'Courier New', monospace;
            font-size: 11px;
            cursor: pointer;
            padding: 2px 6px;
            transition: color 0.2s;
        }

        .message-actions button:hover {
            color: var(--light-cyan);
        }

        .message-actions .delete-btn:hover {
            color: var(--light-red);
        }

        /* Reply Indicator on Messages */
        .reply-context {
            background: rgba(85, 85, 85, 0.3);
            border-left: 2px solid var(--dark-gray);
            padding: 4px 8px;
            margin-bottom: 6px;
            font-size: 12px;
            color: var(--dark-gray);
            max-height: 40px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .reply-context .reply-author {
            color: var(--light-cyan);
            font-weight: bold;
        }

        /* Reply Preview above Input */
        .reply-preview {
            display: none;
            background: rgba(0, 170, 170, 0.1);
            border-left: 3px solid var(--cyan);
            padding: 8px 12px;
            margin: 0;
            font-size: 12px;
            color: var(--light-gray);
            position: relative;
        }

        .reply-preview.active {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .reply-preview .reply-info {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .reply-preview .reply-info .reply-to-user {
            color: var(--light-cyan);
            font-weight: bold;
        }

        .reply-preview .cancel-reply {
            background: none;
            border: none;
            color: var(--light-red);
            font-family: 'Courier New', monospace;
            font-size: 16px;
            cursor: pointer;
            padding: 4px 8px;
            margin-left: 8px;
        }

        .reply-preview .cancel-reply:hover {
            color: var(--red);
        }

        /* Delete Confirmation */
        .delete-confirm {
            display: none;
            background: rgba(170, 0, 0, 0.2);
            border: 1px solid var(--red);
            padding: 8px 12px;
            margin-top: 6px;
            font-size: 12px;
            gap: 8px;
            align-items: center;
        }

        .delete-confirm.active {
            display: flex;
        }

        .delete-confirm span {
            color: var(--light-red);
            flex: 1;
        }

        .delete-confirm button {
            font-family: 'Courier New', monospace;
            font-size: 11px;
            padding: 3px 8px;
            cursor: pointer;
            border: 1px solid;
        }

        .delete-confirm .confirm-yes {
            background: var(--red);
            color: var(--white);
            border-color: var(--light-red);
        }

        .delete-confirm .confirm-no {
            background: none;
            color: var(--light-gray);
            border-color: var(--dark-gray);
        }

        @media (max-width: 768px) {
            .message-actions button {
                font-size: 13px;
                padding: 6px 10px;
                min-height: 32px;
            }

            .reply-preview {
                padding: 10px 12px;
            }

            .reply-context {
                font-size: 13px;
            }
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-link">← Back</a>
    <div class="connection-status disconnected" id="connectionStatus">Connecting...</div>

    <div class="container">
        <div class="header">
            ⚡ SANCTUM SECRETUM ⚡
            <div class="subtitle">The Hidden Chamber of the Initiated</div>
        </div>

        <div class="online-indicator" id="onlineCount">
            ● Seekers present: <span id="userCount">0</span>
        </div>

        <div class="username-section">
            <label>Username:</label>
            <input type="text" id="usernameInput" placeholder="Enter your magical name..." maxlength="20">
        </div>

        <div class="messages-container" id="messagesContainer">
            <div class="system-message">
                🔮 Welcome to the Sanctum Secretum 🔮<br>
                A hidden space for practitioners of the Notory Art
            </div>
            <div id="setupWarning" class="setup-warning" style="display: none;">
                ⚠️ FIREBASE NOT CONFIGURED ⚠️<br>
                Please follow setup instructions in CHATROOM_SETUP.md
            </div>
        </div>

        <div class="reply-preview" id="replyPreview">
            <div class="reply-info">
                Replying to <span class="reply-to-user" id="replyToUser"></span>: <span id="replyToText"></span>
            </div>
            <button class="cancel-reply" onclick="cancelReply()" title="Cancel reply">✕</button>
        </div>

        <div class="input-section">
            <textarea id="messageInput" placeholder="Share your wisdom..."></textarea>
            <button onclick="sendMessage()">SEND</button>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>

    <script>
        // ====================================
        // FIREBASE CONFIGURATION
        // ====================================
        const firebaseConfig = {
            apiKey: "AIzaSyBTAZUXzowkuOHdRQg2rdT_gpNZJjKZlcg",
            authDomain: "ars-notoria-chatroom.firebaseapp.com",
            databaseURL: "https://ars-notoria-chatroom-default-rtdb.firebaseio.com",
            projectId: "ars-notoria-chatroom",
            storageBucket: "ars-notoria-chatroom.firebasestorage.app",
            messagingSenderId: "533152057936",
            appId: "1:533152057936:web:cff000dc8bc91b7a84df55"
        };

        // ====================================
        // APPLICATION CODE
        // ====================================
        let database;
        let storage;
        let messagesRef;
        let currentUsername = localStorage.getItem('chatUsername') || '';
        let isConfigured = false;
        let replyingTo = null; // { key, username, text }

        // Check if Firebase is configured
        function checkConfiguration() {
            if (firebaseConfig.apiKey === "YOUR_API_KEY_HERE") {
                document.getElementById('setupWarning').style.display = 'block';
                document.getElementById('connectionStatus').textContent = 'Not Configured';
                document.getElementById('connectionStatus').className = 'connection-status disconnected';
                return false;
            }
            return true;
        }

        // Initialize Firebase
        function initializeFirebase() {
            if (!checkConfiguration()) {
                return;
            }

            try {
                firebase.initializeApp(firebaseConfig);
                database = firebase.database();
                storage = firebase.storage();
                messagesRef = database.ref('messages');
                isConfigured = true;

                // Update connection status
                const connectedRef = database.ref('.info/connected');
                connectedRef.on('value', (snap) => {
                    const status = document.getElementById('connectionStatus');
                    if (snap.val() === true) {
                        status.textContent = 'Connected';
                        status.className = 'connection-status connected';
                    } else {
                        status.textContent = 'Disconnected';
                        status.className = 'connection-status disconnected';
                    }
                });

                // Listen for new messages
                messagesRef.orderByChild('timestamp').limitToLast(50).on('child_added', (snapshot) => {
                    const message = snapshot.val();
                    message._key = snapshot.key;
                    displayMessage(message);
                });

                // Listen for deleted messages
                messagesRef.on('child_removed', (snapshot) => {
                    const key = snapshot.key;
                    const el = document.querySelector(`[data-message-key="${key}"]`);
                    if (el) {
                        el.remove();
                    }
                });

                // Track online users (simplified - counts connections)
                const onlineRef = database.ref('online');
                onlineRef.on('value', (snapshot) => {
                    const count = snapshot.numChildren();
                    document.getElementById('userCount').textContent = count;
                });

                // Register this user as online
                const userOnlineRef = onlineRef.push();
                userOnlineRef.set(true);
                userOnlineRef.onDisconnect().remove();

            } catch (error) {
                console.error('Firebase initialization error:', error);
                document.getElementById('connectionStatus').textContent = 'Error';
                document.getElementById('connectionStatus').className = 'connection-status disconnected';
            }
        }

        // Display a message in the chat
        function displayMessage(message) {
            const container = document.getElementById('messagesContainer');
            const messageDiv = document.createElement('div');

            const isOwn = message.username === currentUsername;
            messageDiv.className = isOwn ? 'message own' : 'message';
            if (message._key) {
                messageDiv.setAttribute('data-message-key', message._key);
            }

            const time = new Date(message.timestamp).toLocaleTimeString('en-US', {
                hour: '2-digit',
                minute: '2-digit'
            });

            // Reply context (if this message is a reply)
            let replyHtml = '';
            if (message.replyTo) {
                const replyText = message.replyTo.text
                    ? escapeHtml(message.replyTo.text).substring(0, 80)
                    : '[image]';
                replyHtml = `<div class="reply-context">
                    <span class="reply-author">${escapeHtml(message.replyTo.username)}</span>: ${replyText}
                </div>`;
            }

            let content = '';

            // Display text if present
            if (message.text) {
                content += `<div class="message-text">${escapeHtml(message.text)}</div>`;
            }

            // Display image if present
            if (message.imageUrl) {
                const isMobile = window.innerWidth <= 768;
                const loadingAttr = isMobile ? '' : 'loading="lazy"';

                content += `<img src="${message.imageUrl}"
                                 class="message-image"
                                 alt="Shared image"
                                 ${loadingAttr}
                                 onclick="window.open('${message.imageUrl}', '_blank')"
                                 onload="this.style.background='transparent';"
                                 onerror="this.style.background='var(--red)'; this.insertAdjacentHTML('afterend', '<div style=\\'color:var(--red);font-size:12px;\\'>Image failed to load</div>')">`;
            }

            // Action buttons placeholder
            let actionsHtml = `<div class="message-actions">
                <button class="reply-btn" title="Reply">↩ Reply</button>`;
            if (isOwn && message._key) {
                actionsHtml += `<button class="delete-btn" title="Delete">✕ Delete</button>`;
            }
            actionsHtml += `</div>`;

            messageDiv.innerHTML = `
                ${replyHtml}
                <div class="message-header">
                    <span class="message-user">${escapeHtml(message.username)}</span>
                    <span class="message-time">${time}</span>
                </div>
                ${content}
                ${actionsHtml}
            `;

            // Attach reply handler directly (avoids data-attribute encoding issues)
            const replyBtn = messageDiv.querySelector('.reply-btn');
            if (replyBtn) {
                replyBtn.addEventListener('click', () => {
                    startReply(message._key || '', message.username, message.text || '');
                });
            }

            // Attach delete handler directly
            const deleteBtn = messageDiv.querySelector('.delete-btn');
            if (deleteBtn) {
                deleteBtn.addEventListener('click', () => {
                    const existing = messageDiv.querySelector('.delete-confirm');
                    if (existing) {
                        existing.remove();
                        return;
                    }
                    const confirmDiv = document.createElement('div');
                    confirmDiv.className = 'delete-confirm active';
                    confirmDiv.innerHTML = `
                        <span>Delete this message?</span>
                        <button class="confirm-yes">Yes</button>
                        <button class="confirm-no">No</button>
                    `;
                    confirmDiv.querySelector('.confirm-yes').addEventListener('click', () => {
                        deleteMessage(message._key);
                    });
                    confirmDiv.querySelector('.confirm-no').addEventListener('click', () => {
                        confirmDiv.remove();
                    });
                    messageDiv.appendChild(confirmDiv);
                });
            }

            container.appendChild(messageDiv);
            container.scrollTop = container.scrollHeight;
        }

        // Send a message
        function sendMessage() {
            if (!isConfigured) {
                alert('Firebase is not configured. Please follow setup instructions.');
                return;
            }

            const messageText = document.getElementById('messageInput').value.trim();
            const username = document.getElementById('usernameInput').value.trim() || 'Anonymous';

            if (!messageText) return;

            // Save username for next time
            currentUsername = username;
            localStorage.setItem('chatUsername', username);

            // Build message payload
            const payload = {
                username: username,
                text: messageText,
                timestamp: firebase.database.ServerValue.TIMESTAMP
            };

            // Include reply context if replying
            if (replyingTo) {
                payload.replyTo = {
                    key: replyingTo.key,
                    username: replyingTo.username,
                    text: replyingTo.text ? replyingTo.text.substring(0, 100) : ''
                };
                cancelReply();
            }

            // Send to Firebase
            messagesRef.push(payload);

            // Clear input
            document.getElementById('messageInput').value = '';
        }

        // Start replying to a message
        function startReply(messageKey, username, text) {
            replyingTo = { key: messageKey, username: username, text: text };

            const preview = document.getElementById('replyPreview');
            document.getElementById('replyToUser').textContent = username;
            document.getElementById('replyToText').textContent = text.substring(0, 60) || '[image]';
            preview.classList.add('active');

            // Focus the input
            document.getElementById('messageInput').focus();
        }

        // Cancel reply
        function cancelReply() {
            replyingTo = null;
            const preview = document.getElementById('replyPreview');
            preview.classList.remove('active');
        }

        // Delete a message from Firebase
        function deleteMessage(messageKey) {
            if (!isConfigured || !messageKey) return;

            messagesRef.child(messageKey).remove()
                .catch((error) => {
                    console.error('Failed to delete message:', error);
                    alert('Failed to delete message. You may not have permission.');
                });
        }

        // Escape HTML to prevent XSS
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Upload image to Firebase Storage
        async function uploadImage(file) {
            if (!isConfigured || !storage) {
                alert('Firebase Storage is not configured.');
                return null;
            }

            try {
                // Create unique filename
                const timestamp = Date.now();
                const filename = `chat_images/${timestamp}_${file.name}`;
                const storageRef = storage.ref(filename);

                // Show uploading indicator
                const messageInput = document.getElementById('messageInput');
                const originalPlaceholder = messageInput.placeholder;
                messageInput.placeholder = '📤 Uploading image...';
                messageInput.disabled = true;

                // Upload file
                const snapshot = await storageRef.put(file);

                // Get download URL
                const downloadURL = await snapshot.ref.getDownloadURL();

                // Reset input
                messageInput.placeholder = originalPlaceholder;
                messageInput.disabled = false;

                return downloadURL;
            } catch (error) {
                console.error('Error uploading image:', error);
                alert('Failed to upload image. Please try again.');
                document.getElementById('messageInput').disabled = false;
                return null;
            }
        }

        // Handle image paste
        async function handleImagePaste(event) {
            const items = event.clipboardData?.items;
            if (!items) return;

            for (let item of items) {
                if (item.type.indexOf('image') !== -1) {
                    event.preventDefault();

                    const file = item.getAsFile();
                    const imageUrl = await uploadImage(file);

                    if (imageUrl) {
                        const username = document.getElementById('usernameInput').value.trim() || 'Anonymous';
                        currentUsername = username;
                        localStorage.setItem('chatUsername', username);

                        // Build message payload
                        const payload = {
                            username: username,
                            imageUrl: imageUrl,
                            timestamp: firebase.database.ServerValue.TIMESTAMP
                        };

                        // Include reply context if replying
                        if (replyingTo) {
                            payload.replyTo = {
                                key: replyingTo.key,
                                username: replyingTo.username,
                                text: replyingTo.text ? replyingTo.text.substring(0, 100) : ''
                            };
                            cancelReply();
                        }

                        // Send message with image
                        messagesRef.push(payload);
                    }

                    return; // Only handle first image
                }
            }
        }

        // Load saved username
        window.addEventListener('DOMContentLoaded', () => {
            if (currentUsername) {
                document.getElementById('usernameInput').value = currentUsername;
            }
            initializeFirebase();

            // Add paste event listener
            const messageInput = document.getElementById('messageInput');
            messageInput.addEventListener('paste', handleImagePaste);
        });

        // Send message on Enter (Shift+Enter for new line)
        document.getElementById('messageInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
    </script>
</body>
</html>
